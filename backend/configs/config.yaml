# AegisDB — backend configuration

# Deployment profile: dev | prod
# It no longer picks a storage engine — that is PostgreSQL in both profiles.
# What it decides: the demo seed (dev only), the prod JWT-strength check, and
# how permissive CORS / the outbound SSRF guard are.
# Overridable at startup via APP_ENV (or VELA_ENV): `APP_ENV=prod ./server`.
env: "dev"

server:
  addr: ":8080"
  mode: "debug"          # debug | release
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# Storage — the gateway's own metadata store. PostgreSQL only.
# Create it once with:  createdb vela_gateway
# Override at runtime with VELA_PG_DSN.
database:
  # Omitting user= lets libpq fall back to the OS user.
  postgres_dsn: "host=127.0.0.1 port=5432 dbname=vela_gateway sslmode=disable"
  seed: true     # insert demo data when tables are empty

jwt:
  secret: "change-me-vela-gateway-dev-secret"
  ttl_hours: 8

gateway:
  default_policy: "strict"   # strict | approve-1 | audit-only
  # 无 WHERE 的 DELETE/UPDATE 现在按分层开关(ADR 0013,存在 tbl_env_tier)。
  # 这里只剩一个作用:分层化那一次升级,把旧的全局值折进各分层。之后改这里没有效果,
  # 开关在【环境分层】页。
  strict_mode: true
  exec_timeout_seconds: 30

webhook:
  # Configure at runtime via /settings/webhook (endpoint + bearer token).
  endpoint: ""
  secret: ""
  events: "exec,login"
  retry_max: 5
  enabled: false

# MySQL 在线表结构变更(ADR 0011):影子表 → 分块拷贝 → binlog 回放 → 原子改名。
#
# **默认关闭。** 整条链路已经跑通并有真实 MySQL 上的测试,从库延迟限流也接上了
# (主库自报从库 + 心跳表,见 backend/internal/osc/throttle.go)。还差的是一次对着
# 有从库的真实例的演练 —— 那件事代码替不了。打开之前先在自己的一套主从上跑一次,
# 并确认任务记录里的 throttle 那一列写着「已启用」。
#
# 关着的时候接口仍然可读,残留任务看得见。
osc:
  enabled: false
  # 每批拷贝的行数(0 = 用默认值)。调小它让中止更快生效,也让拷贝对主库更温和。
  chunk_size: 0
  # 能容忍的从库延迟上限(秒)。超过它,拷贝停下来等从库追上。
  #
  # 不写 = 30 秒。要关掉限流得**写一个负数**,不能写 0 —— 0 与"这一段根本没写"
  # 分不开,而把没写解释成不限流,会让升级上来的部署悄悄跑在没有限流的状态下。
  #
  # 阈值也不该比心跳的刻度(500ms)还小:那样测出来的延迟自带的虚高就够触发限流,
  # 拷贝会一直等下去。
  max_lag_seconds: 30
