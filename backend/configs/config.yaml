# AegisDB — backend configuration

# Deployment profile: dev | prod
#   dev  → PostgreSQL (postgres_dsn below; run `go run ./cmd/server migrate` first)
#   prod → MySQL      (see docker-compose.yml / mysql_dsn below)
# Overridable at startup via APP_ENV (or AEGISDB_ENV): `APP_ENV=prod ./server`
# flips the whole app to MySQL. AEGISDB_DB_DRIVER=mysql|postgres forces a driver.
env: "dev"

server:
  addr: "127.0.0.1:8080"   # 开发配置只听本机:这份配置带种子管理员和公开的 JWT 密钥,不该暴露到局域网
  mode: "debug"          # debug | release
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# Storage — the active driver is chosen by `env` above (dev→postgres, prod→mysql),
# not set here directly. Both endpoints stay configured so either profile works.
database:
  # MySQL DSN (used when env=prod; matches docker-compose.yml credentials)
  mysql_dsn: "aegisdb:aegisdbpass@tcp(127.0.0.1:3306)/aegisdb?charset=utf8mb4&parseTime=true&loc=Local"
  # PostgreSQL DSN (used when env=dev; matches backend/run-pg.bat). Override with AEGISDB_POSTGRES_DSN.
  postgres_dsn: "host=127.0.0.1 port=5437 user=postgres password=aegisdb_test dbname=aegisdb_dev sslmode=disable TimeZone=Asia/Shanghai"
  auto_migrate: false    # retired: nothing auto-migrates, run `server migrate`
  seed: true             # insert demo data (mirrors the prototype) when tables are empty

jwt:
  secret: "change-me-aegisdb-dev-secret"
  ttl_hours: 8

gateway:
  default_policy: "strict"   # 保留项,不参与判定(issue #123);判定看分层
  # 无 WHERE 的 DELETE/UPDATE 现在按分层开关(迁移 0030,存在 tbl_env_tier)。
  # 这里只剩一个作用:升级到 0030 那一次,把旧的全局值折进各分层。之后改这里没有效果,
  # 开关在【环境分层】页。
  strict_mode: true
  exec_timeout_seconds: 30

# SSO 总闸:SSO 平时在【系统设置 · 会话与安全】开关。写 true(或环境变量 AEGISDB_SSO_DISABLED=1)
# 则无论设置页怎么存都按关闭处理,所有人回到账号口令登录。进不去设置页时用,改完重启生效。
sso:
  disabled: false

# 管理后台 IP 白名单总闸:白名单平时在【系统设置 · 会话与安全】配。写 true(或环境变量
# AEGISDB_ADMIN_IP_ALLOWLIST_DISABLED=1)则白名单一律不生效 —— 配错把管理员全挡在管理后台外面时用,改完重启生效。
admin_ip:
  allowlist_disabled: false

webhook:
  # Configure at runtime via /settings/webhook (endpoint + bearer token).
  endpoint: ""
  secret: ""
  # 订阅按「增删改查」匹配(create|delete|update|read|other),不是按事件类型。
  events: "create,delete,update"
  retry_max: 5
  enabled: false
