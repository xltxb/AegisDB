# AegisDB — PRODUCTION configuration (PostgreSQL).
# Initialize once, then run:
#   VELA_PG_DSN="..." ./vela-gateway init --admin-email you@corp.io --admin-password 'S3cret...'
#   VELA_PG_DSN="..." VELA_JWT_SECRET="..." ./vela-gateway -config config.yaml
# Secrets should come from the environment (VELA_PG_DSN / VELA_JWT_SECRET),
# not this file.

env: "prod"                 # decides seeding / JWT-strength / CORS, not the store

server:
  addr: ":8080"
  mode: "release"
  cors_origins: []          # SPA is served same-origin from web_dir; no CORS needed
  web_dir: "web"            # built frontend (dist) served by the backend

database:
  # REQUIRED: set the production DSN via VELA_PG_DSN — it carries credentials
  # and must not live in a checked-in file. Left empty here on purpose; libpq
  # would otherwise read an empty DSN as "whatever this host defaults to",
  # so supply it explicitly:
  #   VELA_PG_DSN="host=db.internal port=5432 user=vela dbname=vela_gateway sslmode=require"
  postgres_dsn: ""
  seed: false                # NO demo data in production — use `vela-gateway init`

jwt:
  # REQUIRED: set a strong (≥32 char) secret via VELA_JWT_SECRET. The server
  # refuses to start in prod with an empty/placeholder value.
  secret: ""
  ttl_hours: 8

gateway:
  default_policy: "strict"
  # 仅用于分层化(ADR 0013)那次升级的一次性回填,之后按分层开关(【环境分层】页)。
  strict_mode: true
  exec_timeout_seconds: 30

webhook:
  endpoint: ""
  secret: ""
  events: "exec,login"
  retry_max: 5
  enabled: false
  # Relax the outbound SSRF guard to allow loopback/private/link-local webhook
  # targets (e.g. an on-host or same-VPC receiver). Off by default in prod.
  # Only enable for a TRUSTED internal target — it re-opens SSRF to internal
  # services and the cloud metadata endpoint. Overridable via VELA_WEBHOOK_ALLOW_PRIVATE.
  allow_private: false

# 在线表结构变更(ADR 0011)。生产上保持关闭,直到你在一套有从库的实例上演练过
# 一次 —— 限流已经接上(心跳表 + 主库自报从库),但装不装得起来取决于目标实例
# 当时的样子:单机、从库没配 report_host、复制断着,都会让迁移照跑但不限流。
# 那件事任务记录里的 throttle 一列会写明。详见 configs/config.yaml 的注释。
osc:
  enabled: false
  chunk_size: 0
  # 从库延迟上限(秒)。不写 = 30;要关限流写负数,别写 0。
  max_lag_seconds: 30
