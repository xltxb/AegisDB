      summary: '[perms · admin] 删除自定义角色'
      description: |
        只有经「新建角色」建的角色(code 以 r_ 开头,详情里 deletable=true)能删;内置 / 系统角色拒绝。
        还有用户挂着它(主角色或成员)、被发布流程用作审批 / 确认角色、或有未结束的发布单在等它时也拒绝,
        msg 说明原因。删除时连同菜单、能力矩阵、实例标签一并删,写审计。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /roles/{id}/menus:
    put:
      tags: [roles]
      summary: '[perms · admin] 设置菜单权限'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /roles/{id}/capabilities:
    put:
      tags: [roles]
      summary: '[perms · admin] 设置能力矩阵(能力 × 分层 → allow/approve/deny)'
      description: |
        能力维度:`select` `write` `ddl` `grant` `conn` `approve` `explain` `release`。
        `release` 管的是**能不能发起发布单**,与语句本身能不能跑是两个问题。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /roles/{id}/tags:
    put:
      tags: [roles]
      summary: '[perms · admin] 设置角色的数据访问范围(空 = 不限)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /roles/{id}/members:
    post:
      tags: [roles]
      summary: '[perms · admin] 添加成员'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /roles/{id}/members/{userId}:
    delete:
      tags: [roles]
      summary: '[perms · admin] 移除成员'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /osc/jobs/{id}:
    get:
      tags: [osc]
      summary: '一个在线变更任务(生产大表在线加 / 删索引)的进度与结局'
      description: |
        终端在生产实例上对大表(估算 ≥ osc.minRows 行或 ≥ osc.minBytes)做加 / 删索引时,不执行原 DDL,
        而是生成一张在线变更工单(审批单 oscJobId 指向本任务),审批通过后在审批页执行。进度每 3 秒落库:
        phase(preparing / copying / catching_up / cutting_over / done / failed / aborted)、rowsEstimated、
        rowsCopied、rowsReplayed、cutOverAttempts、throttled、paused;成功后 oldTable 是保留下来的原表,
        需 DBA 择时手动删除。够得到那台实例的人都能看;canControl 说调用人能否暂停 / 继续 / 中止。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /osc/jobs/{id}/{action}:
    post:
      tags: [osc]
      summary: '暂停 / 继续 / 中止一个正在跑的在线变更(action = pause | resume | abort)'
      description: |
        要求能访问那台实例,并且是发起人本人、有审批资格的角色,或这条 DDL 对调用人直接放行;写审计。
        中止 = 删掉影子表,原表不动。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, abort] } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /online-users:
    get:
      tags: [users]
      summary: '[perms · admin] 此刻在线的登录会话'
      description: |
        按登录会话列出:用户、部门、来源 IP、浏览器、登录时间、最近一次请求(lastSeen,含页面自动轮询)、
        最近一次操作(lastAction,不含轮询),以及开着的终端(实例、是否执行中)。3 分钟内有请求、或者
        还开着终端的算在线;退出登录 / 停用 / 重置口令后立即消失。只记在内存里:网关重启清空,
        多副本部署时只看得到本副本。用户表的 lastActive 同时改为真实时间(每人每分钟至多写一次)。
      responses:
        '200':
          description: 'OK { sessions: [...], users, terminals, windowSec }'
          content: { application/json: { schema: { $ref: '#/components/schemas/R' } } }
  /users:
    get:
      tags: [users]
      summary: '[perms] 用户列表'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [users]
      summary: '[perms · admin] 管理员建号(设初始密码,直接 active)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}/sso-unbind:
    post:
      tags: [users]
      summary: '[perms · admin] 解除一个账号的 SSO 绑定,恢复口令登录'
      description: |
        绑定发生在这个人第一次经 SRD 授权登录、邮箱对上网关账号的时候。解绑后他可以重新用
        口令登录;下次再经 SRD 登录会重新绑定。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/invite:
    post:
      tags: [users]
      summary: '[perms · admin] 邀请用户(invited 状态,不能登录)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}:
    patch:
      tags: [users]
      summary: '[perms · admin] 改状态 / 角色(停用会立即作废其所有会话)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}/password:
    post:
      tags: [users]
      summary: '[perms · admin] 重置密码(会作废该用户所有会话)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}/mfa/reset:
    post:
      tags: [users]
      summary: '[perms · admin] 解绑该用户的 TOTP'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}/mfa/bind:
    post:
      tags: [users]
      summary: '[perms · admin] 代为生成并绑定 TOTP(返回密钥与 otpauth URI)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /users/{id}/tags:
    get:
      tags: [users]
      summary: '[perms] 该用户的数据访问范围'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put:
      tags: [users]
      summary: '[perms · admin] 设置个人范围 —— 覆盖角色范围,清空则回落到角色'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- risk rules
  /risk-commands:
    get:
      tags: [risk-rules]
      summary: '[terminal] 高危命令字典(风险检查器要读)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [risk-rules]
      summary: '[rules · admin] 新增/覆盖一条命令在各分层的等级'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /risk-commands/{name}:
    patch:
      tags: [risk-rules]
      summary: '[rules · admin] 改单个分层的等级'
      description: 只改已有命令(不存在 → 40400,不会新建);等级 high / mid / off,分层必须存在。
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [risk-rules]
      summary: '[rules · admin] 删除命令(删掉等于全分层放行)'
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- sql review
  /sql-review/rules:
    get:
      tags: [sql-review]
      summary: '[terminal] 规范审查规则库'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewRule' } }
    post:
      tags: [sql-review]
      summary: '[rules · admin] 新建自定义规则(编码自动加 custom. 前缀)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /sql-review/rules/{id}:
    put:
      tags: [sql-review]
      summary: '[rules · admin] 改级别 / 开关 / 参数 / 文案 / 出处;内置规则的编码与方言不可改'
      description: |
        运维拥有的是 level / enabled / params / message / 显示名 与出处标注;
        内置规则的 code、kind 与方言范围随版本走 —— 升级时会回填,改了会被覆盖。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [sql-review]
      summary: '[rules · admin] 删除自定义规则 —— 内置规则只能停用'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'OK / 40001 内置规则不可删除' } }
  /sql-review/catalog:
    get:
      tags: [sql-review]
      summary: '[terminal] 方言 / 分类 / 级别词表,及各规则的参数说明(params:规则编码 → [{key,type,default,dialectDefaults,options}];自定义正则规则在 _regex 下)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /sql-review/check:
    post:
      tags: [sql-review]
      summary: '[terminal] 规范审查(connectionId 优先于 dialect:目标实例决定方言)'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                connectionId: { type: integer, format: int64 }
                dialect: { type: string, enum: [mysql, tidb, dws, oracle] }
                sql: { type: string }
                changeType: { type: string, enum: [dml, ddl], description: '要进的升级单类型;声明了就核对内容。不论声明与否,DML 与 DDL 同在脚本里都报一条 error(release.change_type),与建单时的拒绝一致' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { type: string }
                  result: { $ref: '#/components/schemas/ReviewResult' }

  # ---------------------------------------------------------------- pipelines
  /pipelines:
    get:
      tags: [pipelines]
      summary: '[pipeline] 发布流程模板(含阶段)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PipelineDetail' } }
    post:
      tags: [pipelines]
      summary: '[pipeline · admin] 新建流程'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PipelineDetail' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /pipelines/{id}:
    get:
      tags: [pipelines]
      summary: '[pipeline] 单个流程'
      description: 审批阶段的审批角色在 `stages[].config` 的 `approverRole` 里,见 PipelineStage。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK / 40001 流程不存在
          content: { application/json: { schema: { $ref: '#/components/schemas/PipelineDetail' } } }
    put:
      tags: [pipelines]
      summary: '[pipeline · admin] 覆盖式保存 —— 阶段整体替换,运行中的发布单不受影响'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [pipelines]
      summary: '[pipeline · admin] 删除流程(历史发布单保留自己的阶段快照)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /releases:
    get:
      tags: [pipelines]
      summary: '[pipeline] 发布单分页'
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine }, description: all 需监管角色 }
        - { name: status, in: query, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: integer, format: int64 }, description: '按项目跟进;缺省/0 = 全部项目' }
        - { name: env, in: query, schema: { type: string }, description: '按环境筛选(environment 编码,如 fat;不是分层 tier);缺省 = 全部' }
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
          description: |
            按单号搜索,只在调用者看得到的发布单里找,不分大小写。
            `REL-11` / `rel11` 只匹配这一张;纯数字整段匹配 REL 编号、外部引用里冒号分隔的一段
            (不含最后一段,那是执行顺序)和标题里的 `orderID=`;其它输入按片段匹配 REL 编号、
            标题和外部引用。不搜 SQL 正文。
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK。列表里阶段的 log/findings 为空,详情接口才带。total 是筛选后的总数。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReleaseView' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  envs:
                    type: array
                    items: { type: string }
                    description: 环境筛选的选项:当前 scope 和项目下的发布单落过的环境,不随 env / q / status 收窄
    post:
      tags: [pipelines]
      summary: '[pipeline] 提交发布'
      description: |
        提交时按当前角色与实例**复判一次**:命中拒绝直接 40300;需审批的变更必须选含
        审批阶段的流程,否则拒收(不建单)。执行阶段会再判一次 —— 等待期间规则可能变。
        可带 changeType(dml|ddl,空=按语句推断):声明与内容不符、或 DML/DDL 语句同单,提交即拒。
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseReq' } } }
      responses:
        '200':
          description: OK / 40300 能力矩阵或 release 能力拒绝 / 42800 需二次验证 / 40001 流程不含审批阶段
          content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseView' } } }
  /releases/{id}:
    get:
      tags: [pipelines]
      summary: '[pipeline] 发布单详情(各阶段状态、日志、审查结果)'
      description: |
        详情不直接带审批人。approve 阶段跑到后,`stages[].approvalNo` 是生成的审批单号,
        再调 `GET /approvals?ap=<approvalNo>` 取 `steps`。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK / 40001 或 40300 不存在或无权查看
          content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseView' } } }
  /releases/{id}/abort:
    post:
      tags: [pipelines]
      summary: '[pipeline] 终止发布 —— 仅 pending/waiting;running 不可终止'
      description: 执行中的发布可能已经打到目标库,一个"已终止"的假承诺比没有这个按钮更糟。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /releases/{id}/stages/{stageId}/continue:
    post:
      tags: [pipelines]
      summary: '[pipeline] 人工闸放行:manual 确认点 / execute 执行确认(必须点击后才落库)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: stageId, in: path, required: true, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- approvals
  /approvals:
    get:
      tags: [approvals]
      summary: '[approve] 审批单分页'
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
        - { name: ap, in: query, schema: { type: string }, description: 按单号精确查一张,不受分页影响 }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
        - name: type
          in: query
          description: |
            按工单类型筛。类型不是表上的一列,是由 releaseId / windowId / exportJobId 三个外键推出来的
            (三个都为 0 = 普通命令单),每一行也带着 `type` 字段回来 —— 界面照它画标签,不自己再推一遍。
            拼错的取值**报错**,不是返回空列表:空列表和"确实没有"长得一模一样。
          schema: { type: string, enum: [cmd, release, window, export] }
      responses:
        '200':
          description: |
            OK。每张单带 `steps`:审批链上的人和各自的处理状态,即这张单的审批人。
            发布单审批阶段生成的单 `releaseId` 非 0、`type` 为 release,单号即发布单阶段上的 `approvalNo`。
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      description: 审批单的全部字段(下列为常用的),命令已脱敏
                      properties:
                        id: { type: integer, format: int64 }
                        apNo: { type: string }
                        type: { type: string, enum: [cmd, release, window, export] }
                        releaseId: { type: integer, format: int64, description: 来自发布单时为其 id }
                        instance: { type: string }
                        database: { type: string }
                        env: { type: string }
                        initiator: { type: string }
                        riskLevel: { type: string }
                        status: { type: string, enum: [pending, approved, rejected, expired] }
                        decidedAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
                        steps: { type: array, items: { $ref: '#/components/schemas/ApprovalStep' } }
                        canDecide: { type: boolean, description: 当前用户此刻能否审批这张单 }
                        blockReason: { type: string, description: 不能审批的原因 }
                        canExecute: { type: boolean }
                        canCancel: { type: boolean }
                  total: { type: integer }
                  pending: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
  /approvals/todo:
    get:
      tags: [approvals]
      summary: 右上角"待办":此刻在等当前登录者动手的三类事
      description: |
        `decide` 是等我审批的(在链上、不是自己发起的 —— 与列表页的 canDecide 同一条规则),
        `execute` 是批过了、等我执行的(与 canExecute 同一条规则),`confirm` 是**发布单停在
        人工闸上**等我点「继续」(与 /releases/{id}/stages/{stageId}/continue 同一条规则,
        见 service/release_confirm.go)。前两类的 `apNo` 是工单号,第三类是发布单号,`id` 是
        发布单 id,`stage` 是停在哪一道闸上(manual / execute,送类型不送阶段名 —— 阶段名是
        派生出来的规范中文,界面按读者的语言渲染)。

        `items` 逐张列出,命令已脱敏并截短。它不等于 GET /approvals 的 pending:那个把我自己
        发起、正在等别人审的单子也算进去。不挂菜单闸 —— 没有任何待办的人拿到的是零。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approvals/{id}/approve:
    post:
      tags: [approvals]
      summary: '[approve] 通过 —— 仅审批链成员;默认不可自批'
      description: |
        **通过不执行任何命令。** 审批人按下的是"我同意",不是"现在就跑" ——
        执行时机(业务低峰、应用是否已停、备份是否就绪)由执行的那个人掌握,不是审批这一下。
        通过后工单停在 approved,等人来调 `POST /approvals/{id}/execute`(不限发起人本人,
        见那一条)。发布单的审批同样不执行:它的执行归发布流水线的执行阶段。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approvals/{id}/execute:
    post:
      tags: [approvals]
      summary: '[terminal] 执行已通过的工单 —— 够得到这台实例的人都可以,且只能执行一次'
      description: |
        把"批准了"和"跑过了"分成两件事的那一步。四条边界:

        - **谁能执行**:够得到那台实例(标签授权)、能力矩阵也放行的人 —— 不再限发起人本人。
          需求要的是"值班的人能接手",而值班的人常常正是审批人(ADR 0010 的 2026-09-09 修订)。
          门都按**执行者**算:标签授权、MFA 步进、能力矩阵复判。别人替你跑了,发起人会收到
          通知 —— 审计里当然记着,但"我的变更什么时候生效的"是他一定会问、又不会天天去翻
          审计才知道的事。
        - 一张工单只能执行**一次**(批准是对一次执行的授权,不是可反复使用的通行证)
        - **三类工单走不了这条路**:发布单的执行归流水线(插队会把同一变更应用两次)、
          执行窗口单批准即生效、导出单由后台任务跑 —— 后两类的 `command` 是一句描述而不是
          可执行语句,放它们过去等于把那句话当 SQL 发给数据库
        - 下发前**再判一次**规则:工单可能在待执行状态里放了很久,期间字典、
          实例归属、执行者的角色都可能变

        拒绝的理由原样透出 —— 等审批、已被执行过、看发布单、重新提交,
        这几种拒绝要人做的事完全不同。控制台照着列表行上的 `canExecute` 画按钮即可,
        它读的是同一条规则。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approvals/{id}/cancel:
    post:
      tags: [approvals]
      summary: '[terminal] 撤回自己发起的、尚未执行的工单'
      description: >
        撤回与驳回是两件事:驳回是审批人看过之后说"不行",要留在记录里;撤回是发起人
        说"这张不用了",没有人对它做过判断。所以**审批人不能撤回** —— 否则他可以用撤回
        把一张本该驳回的工单悄悄抹掉,而记录上看不出有人拒绝过什么。
        能撤的只有发起人自己与平台管理员。
        两种状态可撤:等审批的,以及**已批准但还没执行的**(批准解锁的是发起人的一次
        执行,放不放弃是他的事)。跑过的撤不了 —— 命令已经落到库上,改状态只会让记录与
        事实对不上。撤回与执行抢同一把原子闸(status 与 executed_at 在同一次更新里较量),
        谁先谁赢。
        升级单里的审批工单不能单独撤回(流水线不认识这种结论,会停在无人推进的状态)。
        挂在这张单上的东西跟着收场:执行窗口置为 rejected,导出任务标记失败。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approvals/{id}/reject:
    post:
      tags: [approvals]
      summary: '[approve] 驳回'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approvals/{id}/script:
    get:
      tags: [approvals]
      summary: 脚本工单所引用脚本的全文(审批人审阅用)
      description: |
        脚本工单只存摘要;全文给能看到这张工单的人:发起人、审批链成员,以及工单已批准未执行时
        够得到该实例的同事。返回前校验审查时记下的 sha256,文件被改过即拒绝(不展示)。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'OK { filename, content } / 40300 无权查看 / 40001 非脚本工单、文件不存在或已被修改' } }

  # ---------------------------------------------------------------- audit
  /audit:
    get:
      tags: [audit]
      summary: '[audit] 审计日志分页'
      parameters:
        - name: event
          in: query
          description: |
            按**事件类型**筛:intercept(被拦下来)/ approve(审批决定)/ exec(真执行了)/ login。
            这一列是迁移 0039 加的,更早的行为空,按类型筛**筛不到它们** —— 它们当时确实没有记下
            自己是哪一类,不回填也不猜。拼错的取值报错,不是返回空列表。

            **多选**:逗号分隔(`event=intercept,exec`)。任何一个取值认不出都报错 ——
            半懂半不懂地筛,给出的结果比报错更难发现是错的。
          schema: { type: string, example: 'intercept,exec' }
        - name: action
          in: query
          description: |
            按**对数据做了什么**筛:create(增)/ delete(删)/ update(改)/ read(查)/ other。
            与 event 正交 —— 那个说"这一步在流程里是什么",这个说"它动了数据没有"。

            other 是一个**真实的结论**:登录、配置变更、流程标签,以及认不出的语句。它和空
            (迁移 0040 之前写下的行)不是一回事,空表示当时没有这一列。多语句脚本取最重的一条
            (删 > 改 > 增 > 查),所以一个含 DROP 的脚本在 delete 里找得到。

            同样支持逗号分隔的多选(`action=delete,update`)。
          schema: { type: string, example: 'delete,update' }
        - name: source
          in: query
          description: |
            按**入口来源**筛(迁移 0063):query(数据查询)/ terminal(Web 命令行)/ script(上传脚本)/
            export(数据导出,含查询页导出)/ approval(审批单)/ release(变更发布,含外部系统经开放接口
            提交的发布单 —— 那一层看 operator 的「API:系统名」)/ api(发布流水线以外的开放接口)/
            auth(登录认证)/ admin(管理操作)/ system(系统后台任务)。

            `unknown` 筛 0063 之前写下、没有来源的旧行(响应里 `source` 为空串)。来源按服务端路由
            判定,进哈希链(第六代载荷)。同样支持逗号分隔的多选(`source=query,terminal`),认不出的
            取值报错。

            响应里每一行多一个 `source` 字段;`/audit/export` 的 CSV 在 data_action 之后多一列 source。
          schema: { type: string, example: 'query,terminal' }
        - { name: risk, in: query, schema: { type: string, enum: [all, high, mid, low] } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d] } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 绝对区间优先于 range }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - name: instance
          in: query
          description: |
            按实例名精确筛。可选值来自 `/audit/instances` —— 那一条列的是**调用者在审计里
            见得到的**实例,而不是连接表里的全部:一个筛出来永远是空的选项,读起来像
            "这台机器上什么都没发生过"。
          schema: { type: string }
        - name: q
          in: query
          description: |
            模糊匹配**操作人姓名、邮箱、来源 IP**,任意一个命中都算。这几样是同一个问题
            的几半("是谁、从哪台机器"),分成几个输入框只会让人把名字打进 IP 那一格里。
            邮箱也匹配是因为审计行存的是姓名,而人想到一个同事首先想到的是登录名。
            输入里的 `%` 与 `_` 按字面量处理,超过 128 字符截断。
          schema: { type: string }
        - name: group
          in: query
          description: |
            `approval` = 按审批单合并:同一张审批单的行(拦截 → 审批 → 执行)合成一个条目,显示
            最新的那一行;没有审批单号的行照常一条一行。分页与 total 按条目算。响应里多一个
            `groups`(审批单号 → 这张单共几条,可见范围内),点开看全部用 `/audit/approval/{apNo}`。
          schema: { type: string, enum: [approval] }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /audit/approval/{apNo}:
    get:
      tags: [audit]
      summary: '[audit · 平台管理员 / 审计员 / DBA 负责人] 一张审批单的全部操作记录(按时间先后)'
      description: >
        审计列表里点开合并条目时用。**只给平台管理员、审计员与 DBA 负责人**(audit 菜单 + 角色 admin / audit / owner,
        与审计导出同一道闸;admin / audit 另受管理后台 IP 白名单与空闲超时约束,owner 在用户后台用、不受这两条约束,
        2026-10-26 回归 18);其他角色拿到 40300。
        不受列表上的时间 / 风险等筛选限制 —— 点开要看的是这张单完整的经过。最多 500 行。
      parameters: [{ name: apNo, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /audit/verify:
    get:
      tags: [audit]
      summary: '[audit · 平台管理员 / 审计员 / DBA 负责人] 校验审计哈希链(最近 5000 行)'
      description: |
        重算每一行的 `SHA256(前一行 hash ‖ 本行内容快照)`,报出**第一处**对不上的行。不报
        "坏了几行":链是前后咬合的,第一处断掉之后它后面的每一行都会跟着对不上,那个数字
        只会让人以为损坏面很大。

        `badReason` 三种,要人做的事不同:`content` 这一行的内容被改过 · `link` 它的前驱
        哈希接不上上一行(中间有行被删除或插入)· `gen` 它按比前面更老的键集才算得过。
        响应里另附一句 `reasonText`(及其机器可读身份 `reasonRef`,同信封的 msgRef),前端不照着三个取值各写一份文案。

        载荷的键集是**分代**的(0039 的 event、0040 的 action、0041 的 ip),校验时从新到
        老逐代试,并要求代不倒退。整表校验走命令行:`aegisdb verify-audit`,退出码 2
        表示链断了,可直接挂进巡检。

        门槛是 audit 菜单 + **平台管理员、审计员或 DBA 负责人**(角色 admin / audit / owner,路由上的
        AuditSupervisor;admin / audit 另受管理后台 IP 白名单与空闲超时约束)。DBA 负责人(owner)在
        用户后台「操作记录」里看全员,也能校验链(2026-10-26 回归 18 恢复),不受管理后台的两条约束。

        它挡的是"顺手改一行"。载荷是裸 SHA-256、算法公开,拿得到库写权限的人可以把整条
        尾巴重算一遍而链照样自洽(白盒审计 L-12)—— 那一层要靠给载荷加密钥,或把链尾外推
        到网关自己改不了的地方。
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: 无权校验 —— 不是监督角色 }
  /audit/instances:
    get:
      tags: [audit]
      summary: '[audit] 筛选下拉用的实例清单(去重、按字母序)'
      description: >
        只列调用者在审计里见得到的实例,可见性与 /audit 同一条(没有监督角色的人只看得见
        自己那些行,于是也只看得见自己动过的实例)。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /audit/export:
    get:
      tags: [audit]
      summary: '[audit · 平台管理员 / 审计员 / DBA 负责人] 导出 CSV(参数同上:event/action/source/risk/range/from/to/instance/q)'
      description: >
        与单据轨迹、链校验同一道闸(AuditSupervisor,DBA 负责人 2026-10-26 回归 18 恢复)。
        表头自 actor 之后多一列 client_ip,result 之后多两列 event_type、data_action。
        筛选条件与列表共用同一段解析 —— 人是看着筛过的列表按下导出的,两边不一致就会
        导出一份他没在看的东西。
      responses: { '200': { description: text/csv } }

  # ---------------------------------------------------------------- settings
  /settings:
    get:
      tags: [settings]
      summary: '[settings] 读取系统设置(密钥类只回"是否已配置",不回明文)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put:
      tags: [settings]
      summary: '[settings · admin] 保存设置(运行时生效,免重启)'
      description: |
        **逐键校验**:未知键、类型不对、超出范围、非 http(s) 地址、非绝对路径(或含 `..`)、写错的
        IP / 网段,整次 40001、一项都不存。密钥类(含 secret / token / password 的键):非空字符串 =
        替换,`""` = 不改,`null` = 清除。每次保存把真正变了的键记一条 `admin.settings.update`
        审计,密钥类只记键名。

        业务数据查询的全局值以 `bizQuery.*` 为键,保存时整体校验并写审计:
        defaultMaxRows / maxRowsCap / defaultTimeoutSec / timeoutCapSec / maxGrantDays /
        maxConcurrentPerUser / maxConcurrentPerSource / exportEnabled / maxDailyPerUser
        (每人每天执行 + 导出次数,0 = 不限,上限 100000)。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /settings/webhook:
    put:
      tags: [settings]
      summary: '[settings · admin] 保存 Webhook(留空 secret 表示保持不变)'
      description: |
        `endpoint` 只认 http/https,拒绝链路本地(169.254.0.0/16、fe80::/10)与云元数据地址;
        `retryMax` 0 ~ 10(0 = 保持原值)。响应与 GET 一致:`secret` 恒为空,另带 `hasSecret`。

        `events` 是订阅列表,逗号分隔。它按**增删改查**取值:`create|delete|update|read|other`
        —— 与审计行上 `data_action` 那一列同一组字符串(见 GET /settings 的 `webhookActions`)。
        认不出的取值在保存时被丢掉(不报错,只归一),空列表是一个明确的"什么都不推"。

        **它以前按事件类型取值**(intercept/approve/exec/login)。升级时启动期会把这种旧订阅
        放宽成全部五类并打一条 WARN 日志 —— 旧值一个都匹配不上,不迁就是一次静默停推。

        `envs` 是推送的环境(环境代码,逗号分隔),空串 = 全部环境,省略 = 保留原值;不存在的环境
        代码在保存时被丢掉。按审计行上那一刻的环境快照(`env`)匹配;没有环境的事件(登录、改设置
        这类不属于任何实例的)不受环境约束。删除一个环境、实例并入别的环境时,这里的代码跟着换成
        接手的环境。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /settings/webhook/test:
    post:
      tags: [settings]
      summary: '[settings · admin] 发送测试事件'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /settings/webhook/deliveries:
    get:
      tags: [settings]
      summary: '[settings · admin] 最近的投递结果'
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50 } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /settings/lark/test:
    post:
      tags: [settings]
      summary: '[settings · admin] 测试飞书连通性'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /service-accounts:
    get:
      tags: [settings]
      summary: '[settings] 服务账号列表(机器主体:角色/标签/已绑定凭据数)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccountView' }
    post:
      tags: [settings]
      summary: '[settings · admin] 创建服务账号(kind=service)'
      description: 对接升级单/CI/CD 系统的机器主体。像人一样持有角色与标签,能力矩阵、标签范围、审计链一视同仁;区别只有两处且都朝收紧方向 —— 控制台登录一律拒绝(口令不存在也设不上),security.mfaMandatory 不约束它(机器无法注册 TOTP,第二因子是 API 凭据的 bcrypt secret + 每凭据 IP 白名单)。身份标识自动生成为 svc-<slug>-<hash>@service.aegisdb,仅作唯一标识,不是邮箱。停用走常规 PATCH /users/{id}(停用即刻切断其所有凭据,已有回归覆盖)。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountReq' }
      responses: { '200': { description: 'OK / 40001 名称为空、重名、角色缺失或不存在、含平台管理员角色' } }
  /api-clients:
    get:
      tags: [settings]
      summary: '[settings] 开放接口凭据列表(响应里没有密钥)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/APIClient' } }
    post:
      tags: [settings]
      summary: '[settings · admin] 签发凭据 —— 明文密钥只在此响应里出现一次'
      description: 只能绑服务账号(非 admin);scopes / allowIps 逐项校验,非法 40001。签发写审计(admin.apiclient.create,只记 key 不记 secret)。
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/APIClientReq' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: '#/components/schemas/APIClient' }
                  token: { type: string, description: '`<key>.<secret>`,直接放进 Authorization', example: ak_xxx.yyy }
  /api-clients/{id}:
    put:
      tags: [settings]
      summary: '[settings · admin] 改名称 / 服务账号 / scope / IP 白名单 / 启停'
      description: 局部更新:只有请求里出现的字段会变,缺席字段一律保持原值(启停开关只发 {enabled},不会动 IP 白名单;allowIps 传空串才是显式清空)。key 与 secret 不可修改 —— 轮换 = 新签一把 + 吊销旧的,避免正在用的系统毫无征兆地开始 401。改绑同样只接受服务账号;scopes / allowIps 校验同创建(allowIps 逐项须是 IP 或 CIDR,按解析后的地址/网段去重,规范化后上限 512 字符)。修改立即生效(鉴权每次请求都查库,无缓存)。每次修改写审计(admin.apiclient.update),改了 allowIps 时同时记改前值 allow_ips_before。控制台编辑白名单时,清空(= 不限来源)前会二次确认。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'OK / 40001 凭据不存在、改绑对象不是服务账号或是管理员、scopes/allowIps 非法、流程不存在或已停用' } }
    delete:
      tags: [settings]
      summary: '[settings · admin] 吊销凭据(使用它的系统立刻调不通)'
      description: 吊销写审计(admin.apiclient.delete)。吊销后再用这把凭据调用返回 40100(凭据无效);只是停用(enabled=false)则返回 40300。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- open API
  /inspection-reports/latest:
    get:
      tags: [inspection]
      summary: '[inspection] 每个实例最近一份巡检报告(没有报告的实例也列出)'
      description: |
        菜单 inspection,且角色是平台管理员、DBA 负责人或 DBA L2(多角色取并集);不按实例标签收窄。
        `report` 为 null 表示这个实例还没收到过报告;`today` 是服务器的今天,前端据此标出今天没收到报告的实例。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: string, example: '2026-10-15' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        connectionId: { type: integer, format: int64 }
                        instance: { type: string }
                        env: { type: string }
                        engine: { type: string }
                        report:
                          nullable: true
                          allOf: [{ $ref: '#/components/schemas/InspectionReport' }]
  /inspection-reports:
    get:
      tags: [inspection]
      summary: '[inspection] 某实例的巡检报告历史(按巡检日期倒序)'
      parameters:
        - { name: instanceId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 30, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InspectionReport' } }
                  total: { type: integer }
  /inspection-reports/{id}:
    get:
      tags: [inspection]
      summary: '[inspection] 单份巡检报告的摘要与问题列表'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK(报告不存在返回 40400)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionReport' }
  /inspection-reports/{id}/view:
    get:
      tags: [inspection]
      summary: '[inspection] 巡检报告页面(给控制台的沙箱 iframe 用)'
      description: |
        成功时返回 `text/html`,带 `Content-Security-Policy: sandbox allow-scripts`:脚本能跑,但在不透明来源里,
        碰不到控制台的存储和 Cookie。每次读取记一条审计。报告不存在或文件丢失返回 404 纯文本。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 报告页面
          content:
            text/html:
              schema: { type: string }
        '404':
          description: 报告不存在或文件已丢失
          content:
            text/plain:
              schema: { type: string }
  /inspection-reports/{id}/html:
    get:
      tags: [inspection]
      summary: '[inspection] 巡检报告的完整 HTML(纯文本、附件方式返回)'
      description: |
        成功时直接返回报告原文:`Content-Type: text/plain`、`Content-Disposition: attachment`、`X-Content-Type-Options: nosniff`
        —— 浏览器不会把它当页面直接打开执行。控制台显示报告走 `/inspection-reports/{id}/view`。
        每次读取记一条审计。出错时返回 JSON 信封:报告不存在 / 文件丢失 40400,保存路径未配置 42602。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 报告 HTML 原文
          content:
            text/plain:
              schema: { type: string }
  /open/inspection-reports:
    post:
      tags: [open-api]
      summary: '[scope inspection:write] 上传一份 AI 巡检报告(同一实例同一天再传即覆盖)'
      security:
        - openApiKey: []
      description: |
        AI 巡检系统每巡检完一个实例调一次。`inspection:write` 不在默认范围里,须在凭据上显式勾选。
        请求体上限 20MB。错误码:实例名在平台里不存在 40400(不要重试,先核对实例名)、字段不合法 40001(信息里说明哪个字段)、
        超过 20MB 41300、凭据没有该范围 40300、巡检报告保存路径未配置 42602。网络错误或 5xx 建议指数退避重试 3 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance, date, level, html]
              properties:
                instance: { type: string, description: 平台实例名(唯一) }
                date: { type: string, example: '2026-10-15', description: '巡检日期 YYYY-MM-DD,不能晚于明天' }
                inspectedAt: { type: string, format: date-time }
                score: { type: integer, minimum: 0, maximum: 100 }
                level: { type: string, enum: [ok, warning, critical] }
                counts:
                  type: object
                  properties:
                    critical: { type: integer, minimum: 0 }
                    warning: { type: integer, minimum: 0 }
                    info: { type: integer, minimum: 0 }
                findings:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/InspectionFinding' }
                html: { type: string, description: 完整报告 HTML }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  replaced: { type: boolean, description: 'true = 覆盖了同实例同一天的旧报告' }
  /open/releases:
    post:
      tags: [open-api]
      summary: '[scope release:create] 提交 SQL 升级单'
      security:
        - openApiKey: []
      description: |
        JSON 或 multipart/form-data 都接受;后者用 `file` 字段直传 .sql。脚本上限 15MB:multipart 的 `file`、JSON 的 `script`、
        解码后的 `scriptBase64` 同一尺寸、同一句拒绝(40001「脚本超过 15MB 上限」);JSON 请求体本身另有约 21MB 的外层上限。
        与控制台走**同一条** submitRelease:同样的流程模板、规则库、审批链、执行前复判、审计链。
        可带 changeType(dml|ddl,空=推断):两类语句不得同单,声明与内容不符即拒;响应回带 changeType。
        **执行需网关侧人工确认**:单据到达执行阶段会停在 waiting,由网关操作员在控制台点击「确认执行」后才落库 —— 轮询时看到 execute 阶段 waiting 属正常流转,不是卡单。
        审计行记 `actor=服务账号 / operator=API:<凭据名>`。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenReleaseReq' }
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                externalRef: { type: string }
                instance: { type: string }
                database: { type: string }
                changeType: { type: string, enum: [dml, ddl] }
                reason: { type: string }
                sql: { type: string }
                file: { type: string, format: binary }
      responses:
        '200':
          description: |
            OK(重试同一 externalRef 返回同一张单)/ 40300 服务账号无权 /
            42800 需二次验证 / 40001 实例或流程不存在、内容为空、流程不含审批阶段
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenReleaseResp' } } }
  /open/releases/{relNo}:
    get:
      tags: [open-api]
      summary: '[scope release:read] 查询升级单状态与各阶段日志'
      security:
        - openApiKey: []
      parameters: [{ name: relNo, in: path, required: true, schema: { type: string }, example: REL-42 }]
      responses:
        '200':
          description: OK / 40300 单据存在但不是同一服务账号名下的凭据经开放接口提交的(同一服务账号的其他凭据、含已删除的旧凭据提交的可查,便于轮换;其他服务账号与控制台建的单不行)/ 40001 单号不存在
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenReleaseResp' } } }
  /open/releases/{relNo}/abort:
    post:
      tags: [open-api]
      summary: '[scope release:create] 终止本系统提交的升级单(仅 pending/waiting)'
      security:
        - openApiKey: []
      description: 只能终止本凭据提交的单。每次调用(含被拒的)写审计 open.release.abort,actor=服务账号、operator=API:<凭据名>。
      parameters: [{ name: relNo, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'OK / 40300 不是本凭据提交的单 / 40001 单号不存在或当前状态不可终止' } }
  /open/releases/{relNo}/approval:
    post:
      tags: [open-api]
      summary: '[scope release:approve] 外部审批:替审批链上的人通过 / 驳回发布单当前的审批阶段'
      security:
        - openApiKey: []
      description: |
        给外部审批系统(OA、工单平台)用。`release:approve` 不在默认范围里,须在凭据上显式勾选。

        - **凭据不是审批人。** `approver` 必须点名一个网关账号(邮箱,不分大小写),此人必须在这张单的审批链上、
          不是发起人、不是服务账号、未停用 —— 与控制台审批按钮同一条规则。审批链上有谁,见状态查询里
          审批阶段的 `approvers`。
        - **范围:** 服务账号实例范围内的发布单都能批,不要求是本凭据提交的。
        - **作用对象:** 发布单当前在等的那个审批阶段;流程里有多个审批阶段时,一次只决定正在等的那个。
        - **先到先得:** 控制台照样能批。已被决定过的单返回 0、`alreadyDecided=true`、`status` 为已有结论,
          本次请求不改变任何东西。
        - **审计:** 每次调用(含被拒的)写 open.release.approve / open.release.reject,actor = 服务账号、
          operator = API:<凭据名>,并记审批人账号与意见;决定本身另记一条,operator = 审批人姓名。
      parameters: [{ name: relNo, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approver, action]
              properties:
                approver: { type: string, example: chenhao@aegisdb.io, description: 审批人的网关账号邮箱 }
                action: { type: string, enum: [approve, reject], description: 不用布尔值:漏传不会被读成驳回 }
                comment: { type: string, maxLength: 200, description: 审批意见,记入审计 }
      responses:
        '200':
          description: |
            OK / 40300 审批人不在链上、是发起人本人,或发布单的实例不在服务账号范围内(msg 说明是哪一条)/
            40001 发布单不存在、还没走到审批阶段、审批人账号不存在或不可用、action 非法
          content:
            application/json:
              schema:
                type: object
                properties:
                  relNo: { type: string }
                  approvalNo: { type: string }
                  status: { type: string, enum: [approved, rejected, expired, pending], description: 审批单此刻的结论 }
                  alreadyDecided: { type: boolean, description: true = 本次请求之前已被决定(控制台或别的调用抢先),本次没有改变任何东西 }
                  releaseStatus: { type: string, enum: [pending, running, waiting, success, failed, aborted] }
  /open/releases/{relNo}/confirm:
    post:
      tags: [open-api]
      summary: '[scope release:approve] 外部确认:替确认人放行发布单此刻停着的「人工确认」(不含执行变更)'
      security:
        - openApiKey: []
      description: |
        给外部平台的「待人工确认」卡片用。与外部审批共用 `release:approve`(须显式勾选)。

        - **凭据不是确认人。** `confirmer` 必须点名一个网关账号(邮箱,不分大小写),按控制台「继续」按钮同一条规则核对:
          发起人本人不能放行(除非开了自审批);阶段配了确认角色须在角色里,没配须有审批能力。
          能放行的人见状态查询里人工确认阶段的 `approvers`(停着时才有)。
        - **范围:** 服务账号实例范围内的发布单,不要求是本凭据提交的。
        - **只管人工确认(manual)。** 「执行变更」的确认执行只能在网关上由人操作,本接口永远不放行它:
          发布单停在执行变更上时返回 40001;人工确认放行后若流水线停到执行变更,响应 `executePending=true`,提示去网关点。
        - **先到先得 / 重试安全:** 已放行过的返回 0、`alreadyConfirmed=true`,本次不改变任何东西。只放行,不驳回(不放行用 abort)。
        - **审计:** 每次调用(含被拒的)写 open.release.confirm,actor = 服务账号、operator = API:<凭据名>;
          放行本身另记一条,operator = 确认人姓名。
      parameters: [{ name: relNo, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [confirmer]
              properties:
                confirmer: { type: string, example: chenhao@aegisdb.io, description: 确认人的网关账号邮箱 }
                comment: { type: string, maxLength: 200, description: 备注,记入审计 }
      responses:
        '200':
          description: |
            OK / 40300 确认人无权放行(发起人本人、不在确认角色里),或发布单的实例不在服务账号范围内 /
            40001 发布单不存在、当前没有停在人工确认上、停在执行变更(须在网关上确认)、确认人账号不存在或不可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  relNo: { type: string }
                  stage: { type: string, description: 放行的阶段名 }
                  alreadyConfirmed: { type: boolean, description: true = 本次请求之前已被放行,本次没有改变任何东西 }
                  releaseStatus: { type: string, enum: [pending, running, waiting, success, failed, aborted] }
                  executePending: { type: boolean, description: true = 发布单此刻停在执行变更,须到网关上人工确认执行 }
  /open/sql-review:
    post:
      tags: [open-api]
      summary: '[scope review:check] 规范审查预检,不建单'
      security:
        - openApiKey: []
      description: CI 合并前的门禁:同一套规则库,只回结果,不产生任何单据。脚本(multipart 的 file、JSON 的 script / 解码后的 scriptBase64)与建单接口同一条 15MB 上限,超限 40001 明确报错。`dialect` 取 mysql / tidb / dws / oracle(大小写不敏感);也认 all / generic / postgres(按通用规则审查)与带方言词的引擎名(gaussdb → dws、polardb → mysql 等),认不出的值 40001;带了 instance/connectionId 时以实例引擎为准,dialect 不参与校验。每次调用写审计 open.sqlreview(只记结论,不记 SQL 原文),operator=API:<凭据名>。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instance: { type: string }
                connectionId: { type: integer, format: int64 }
                dialect: { type: string, example: mysql, description: 'mysql / tidb / dws / oracle;另认 all、generic、postgres 与引擎名' }
                sql: { type: string }
                script: { type: string }
                scriptBase64: { type: string }
                changeType: { type: string, enum: [dml, ddl], description: '要进的升级单类型;声明了就核对内容。不论声明与否,DML 与 DDL 同在脚本里都报一条 error(release.change_type),与建单时的拒绝一致' }
          multipart/form-data:
            schema:
              type: object
              properties:
                instance: { type: string }
                dialect: { type: string, example: mysql, description: 'mysql / tidb / dws / oracle;另认 all、generic、postgres 与引擎名' }
                sql: { type: string }
                file: { type: string, format: binary }
                changeType: { type: string, enum: [dml, ddl], description: '要进的升级单类型;声明了就核对内容。不论声明与否,DML 与 DDL 同在脚本里都报一条 error(release.change_type),与建单时的拒绝一致' }
      responses:
        '200':
          description: OK / 40001 内容为空、实例不存在、dialect 非法、脚本超过 15MB / 40300 服务账号无权访问该实例
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance: { type: string }
                  result: { $ref: '#/components/schemas/ReviewResult' }
  /open/instances:
    get:
      tags: [open-api]
      summary: '[scope release:read] 本凭据可访问的实例(名字即 create 的 instance 参数)'
      security:
        - openApiKey: []
      responses:
        '200':
          description: OK。按服务账号的**实例访问范围**(标签)过滤,**不按发布能力过滤**:列出来的实例不保证能发布 —— 比如只读角色的服务账号也会列出实例,但对其提交 DDL/DML 会按能力矩阵拒绝(40300)或要求审批。能否发布以提交时(及执行前复判)的判定为准。
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    instance: { type: string }
                    env: { type: string }
                    engine: { type: string }
                    database: { type: string }
                    status: { type: string, enum: [online, maint] }
  /open/query-sources:
    get:
      tags: [open-api]
      summary: '[scope grant:read] 可授权的业务查询源(只含管理员标记过的从库实例)'
      description: |
        查询授权(业务方数据查询)的第一步:外部审批系统用它给审批单填"实例"。只列出管理员在
        控制台标记为「业务查询源」的实例(约定指向从库、使用只读库账号),主库永远不会出现在这里。
        按凭据绑定的服务账号的标签范围过滤。

        grant:read / grant:write **不在凭据的默认范围里**,签发凭据时必须显式勾选。
      security:
        - openApiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, description: '下发授权时的 sourceId' }
                    name: { type: string }
                    engine: { type: string }
                    env: { type: string }
                    status: { type: string, enum: [online, maint] }
  /open/query-sources/{id}/databases:
    get:
      tags: [open-api]
      summary: '[scope grant:read] 一个业务查询源上的库名'
      description: |
        现查实例(不含系统库,含没有表的库,至多 2000 个);现查失败时退回网关的元数据缓存。
        下发授权时的 database 必须是这里列出的名字之一(区分大小写)。
      security:
        - openApiKey: []
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: OK / 40001 实例不是业务查询源 / 40300 服务账号无权访问该实例
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /open/query-grants:
    get:
      tags: [open-api]
      summary: '[scope grant:read] 查询授权列表'
      description: |
        只列**本凭据下发的**授权。可按 email(不分大小写)、sourceId、database、status、externalId 筛选。
        status 是**生效状态**:active / pending(未到开始时间)/ expired / revoked。最多返回 1000 条,按 id 倒序。
      security:
        - openApiKey: []
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: integer } }
        - { name: database, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, pending, expired, revoked] } }
        - { name: externalId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QueryGrant' } }
    put:
      tags: [open-api]
      summary: '[scope grant:write] 下发或更新一条查询授权(外部审批通过后调用)'
      description: |
        按 (email, sourceId, database) 定位,一个人对一个库只有一条授权;再次下发按 externalId 区分:
        与当前单号相同 = 重试,**原样返回、不改动**(已撤销的不会恢复);新单号 = **更新**这一条
        (上限、有效期、导出开关、外部单号换成新的;已撤销 / 已过期的重新生效);已被新单取代的
        旧单号 = 40001 拒绝。响应里 created 区分新建与更新。

        网关只执行,不审批,但会拒绝越界的请求:实例必须是业务查询源、库必须真实存在、
        maxRows / timeoutSec 不能超过全局上限(默认 10000 行 / 300 秒)、endsAt 必填且有效期
        不超过 90 天(均可在网关设置里调整)。被授权人不能是服务账号或已停用账号。

        被授权人在网关里没有账号时**自动建号**,只挂「业务查询」角色(该角色本身不开放任何实例与
        操作,查询权只来自授权);已有账号追加这个角色,原有角色不变。每次下发、更新都写审计,
        记下外部系统、外部单号与审批人。
      security:
        - openApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [externalId, email, sourceId, database, endsAt]
              properties:
                externalId: { type: string, maxLength: 128, description: '外部审批单号' }
                email: { type: string }
                name: { type: string, description: '自动建号时的姓名' }
                dept: { type: string, description: '自动建号时的部门' }
                sourceId: { type: integer }
                database: { type: string }
                maxRows: { type: integer, description: '0 = 全局默认(1000)' }
                timeoutSec: { type: integer, description: '0 = 全局默认(30)' }
                allowExport: { type: boolean }
                startsAt: { type: string, format: date-time, description: '不填 = 现在' }
                endsAt: { type: string, format: date-time }
                approver: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: 'OK { created, grant } / 40001 参数越界或旧审批单(原因在 msg)/ 40300 服务账号无权访问该实例'
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean }
                  grant: { $ref: '#/components/schemas/QueryGrant' }
    delete:
      tags: [open-api]
      summary: '[scope grant:write] 按外部单号撤销(只在本凭据下发的授权里找)'
      security:
        - openApiKey: []
      parameters: [{ name: externalId, in: query, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: OK,返回被撤销的授权 / 40001 找不到
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QueryGrant' } }
  /open/query-grants/{id}:
    delete:
      tags: [open-api]
      summary: '[scope grant:write] 按 id 撤销一条查询授权(只能撤本凭据下发的)'
      description: 撤销立即生效,写审计。已撤销的再撤销一次不报错。别的系统下发的授权回"不存在"。
      security:
        - openApiKey: []
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200':
          description: OK / 40001 不存在
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QueryGrant' } }
  /open/pipelines:
    get:
      tags: [open-api]
      summary: '[scope release:read] 发布流程一览(只读了解;建单不可指定流程)'
      security:
        - openApiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pipeline: { type: string }
                    tier: { type: string }
                    isDefault: { type: boolean }
                    stages: { type: array, items: { type: string } }
