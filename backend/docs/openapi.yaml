openapi: 3.0.3
info:
  title: AegisDB API
  version: "2.0"
  description: |
    数据库管理网关的 HTTP 接口。**每一条**已注册的路由都在本文件里 —— 由
    `TestOpenAPICoversEveryRoute` 静态守住:新增路由但没写进来,测试直接失败。

    ## 三套鉴权,不要混用

    | 面 | 前缀 | 鉴权 | 谁在调 |
    |---|---|---|---|
    | 控制台 | `/api/v1` | `Authorization: Bearer <JWT>` | 登录的人 |
    | 开放接口 | `/api/v1/open` | `Authorization: Bearer <key>.<secret>` | 外部系统 |
    | 回调 | `/api/v1/approvals/lark/callback` | 共享密钥(Bearer 或 `?secret=`) | 审批服务 |

    开放接口**不走**控制台的 IP 白名单:那个设置回答的是"哪些办公网可以打开控制台",
    把 CI runner 的出口段并进去等于为了一台机器放宽控制台的边界。每把凭据自带白名单。

    ## 响应包

    一律 HTTP 200,业务结果在 `code` 里 —— 包括错误。

    ```json
    { "code": 0, "msg": "ok", "data": { } }
    ```

    | code | 含义 | 客户端该做什么 |
    |---|---|---|
    | `0` | 成功 | 读 `data` |
    | `40001` | 参数错误 | `msg` 说明了哪里不对,直接展示 |
    | `40100` | 未登录 / Token 失效 / API 凭据无效 | 重新登录;开放接口检查 key.secret |
    | `40300` | 无权(菜单、能力矩阵、scope、非本人单据) | 展示 `msg`,不要重试 |
    | `40301` | 来源 IP 不在白名单 | 联系管理员放行 |
    | `42200` | 命令被拦截,已转审批 | `data.approvalNo` 是审批单号 |
    | `42600` | 脚本保存路径未配置 | 引导去【系统设置 · 网关】 |
    | `42601` | 导出保存路径未配置 | 同上 |
    | `42800` | 需要二次验证(TOTP) | 弹验证码输入,带 `mfaCode` 重试 |
    | `42900` | 登录尝试过于频繁 | 退避后再试 |
    | `50000` | 服务端错误 | 可重试;`msg` 不含内部细节 |

    ## 控制台的三层闸门

    每条控制台写接口要过:**菜单权限** → **能力矩阵(角色 × 能力 × 分层)** → **高危命令字典**。
    下面每个操作的 `summary` 都标了它要求的守卫,格式 `[菜单 · admin]`:

    - `[terminal]` 需要终端菜单;`[perms · admin]` 需要权限菜单**且**是平台管理员。
    - 没有标注 = 任何已登录用户可调。

    ## 分层(tier)不是环境(environment)

    规则挂在**分层**上,实例归属**环境**,一个分层承载 N 个环境。凡是参数名为
    `tierCode` 的地方都不接受环境码 —— 查不到规则行等于放行,传错会让实例失去管控。

servers:
  - url: /api/v1

tags:
  - name: auth
    description: 登录、会话、当前用户、TOTP 绑定
  - name: terminal
    description: 命令预检与执行(同步 / 异步 / WebSocket)
  - name: scripts
    description: SQL 脚本上传、扫描、执行
  - name: snippets
    description: 个人快捷脚本(Alt+1…9)
  - name: export
    description: 数据导出(压缩加密分卷)
  - name: connections
    description: 实例配置与库表元数据
  - name: tiers
    description: 控制分层与环境
  - name: roles
    description: 角色、菜单、能力矩阵、标签范围
  - name: users
    description: 账号与个人数据范围
  - name: risk-rules
    description: 高危命令字典(判"危不危险")
  - name: sql-review
    description: 规范审查规则库(判"写得对不对")
  - name: pipelines
    description: 发布流程模板与发布单(CI/CD)
  - name: approvals
    description: 审批单与外部审批回调
  - name: audit
    description: 防篡改审计链
  - name: settings
    description: 系统设置、Webhook、开放接口凭据
  - name: open-api
    description: 外部系统提交 SQL 升级单(key/secret 鉴权)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 控制台会话 Token,由 `/auth/login` 签发。
    openApiKey:
      type: http
      scheme: bearer
      description: |
        开放接口凭据,格式 `<key>.<secret>`,在【系统设置 · 开放接口】签发。
        也接受 `X-Vela-Key` + `X-Vela-Secret` 两个请求头(给保留了 Authorization 的客户端)。

  schemas:
    R:
      type: object
      description: 统一响应包。
      required: [code, msg]
      properties:
        code: { type: integer, example: 0 }
        msg: { type: string, example: ok }
        data: {}

    LoginReq:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: linwei@vela.io }
        password: { type: string, format: password }
        mfaCode: { type: string, description: 已绑定 TOTP 的账号在第二步提交 }

    MeResp:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        roleId: { type: integer, format: int64, description: 主角色(展示与 JWT 用) }
        roleCodes:
          type: array
          items: { type: string }
          description: 持有的全部角色码;权限取所有角色的并集
        canApprove: { type: boolean }
        mfaEnabled: { type: boolean }
        menus:
          type: object
          additionalProperties: { type: boolean }
          description: 菜单键 → 是否可见。缺失的键读作"无权"。
        capabilities:
          type: object
          description: 能力 → 分层 → 等级(allow / approve / deny)。
          additionalProperties:
            type: object
            additionalProperties: { type: string }

    RiskCheckReq:
      type: object
      required: [connectionId, sql]
      properties:
        connectionId: { type: integer, format: int64 }
        sql: { type: string }
    RiskCheckResp:
      type: object
      properties:
        risk: { type: string, enum: [high, mid, low] }
        action: { type: string, enum: [allow, approve, deny] }
        requiresApproval: { type: boolean }
        matchedRule: { type: string, description: 命中的规则;多条以 " + " 连接 }
        command: { type: string, description: 判定所依据的那条语句(批量时是最严的一条) }

    ExecReq:
      type: object
      required: [connectionId, sql]
      properties:
        connectionId: { type: integer, format: int64 }
        sql: { type: string, description: 可含多条语句;按最严的一条判定 }
        reason: { type: string, description: 转审批时写进工单 }
        mfaCode: { type: string, description: 目标分层要求二次验证时必填 }
        database: { type: string, description: 实例内的目标库;留空用连接默认库 }
    ExecResp:
      type: object
      properties:
        risk: { type: string }
        output: { type: string }
        rows: { type: integer }
        ms: { type: integer, description: 数据库执行耗时(实测,不含网关开销) }
        columns: { type: array, items: { type: string } }
        data: { type: array, items: { type: array, items: { type: string } } }
        truncated: { type: boolean }
        intercepted: { type: boolean }
        approvalNo: { type: string }

    ReviewRule:
      type: object
      description: |
        规范审查规则库的一行。`code` 是身份 —— 内置规则靠它绑定实现,不可改名。

        规则库按公司四份规范(docs/ 下 MySQL / TiDB / Oracle / DWS)重写,见
        docs/adr/0007-sql-review-from-specs.md。`spec`/`specRef` 是**引文**,
        `level` 是这条发现在本平台**值多少钱** —— 两者刻意分开:把某条规则降成
        告警是运营决定,不等于改了公司规范。
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: ddl.require.primary.key }
        name: { type: string }
        dialect: { type: string, description: '`all` 或逗号分隔方言集,如 `mysql,tidb`', example: 'mysql,tidb' }
        category: { type: string, enum: [dml, ddl, structure, naming, index, security, perf] }
        level: { type: string, enum: [error, warn, info], description: error 会卡住发布,warn/info 只记录 }
        kind: { type: string, enum: [builtin, regex] }
        enabled: { type: boolean }
        params: { type: string, description: JSON 字符串;空表示用内置默认 }
        message: { type: string }
        sortOrder: { type: integer }
        spec: { type: string, enum: [critical, mandatory, recommended, ''], description: '规范分级:高危/强制/建议;空 = 规范未覆盖,平台内置的防护' }
        specRef: { type: string, description: '出处,如 `DWS对象设计和业务开发规范 RULE 13`;空 = 平台内置', example: 'DWS对象设计和业务开发规范 RULE 13' }
    ReviewFinding:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        level: { type: string, enum: [error, warn, info] }
        category: { type: string }
        stmt: { type: integer, description: 第几条语句(从 1 起) }
        line: { type: integer }
        sql: { type: string, description: 语句摘录,口令已打码 }
        message: { type: string }
    ReviewResult:
      type: object
      properties:
        dialect: { type: string }
        statements: { type: integer }
        errors: { type: integer }
        warnings: { type: integer }
        infos: { type: integer }
        findings: { type: array, items: { $ref: '#/components/schemas/ReviewFinding' } }
        passed:
          type: boolean
          description: 无 error 级命中。**不是**"零命中" —— 警告从不拦截。

    PipelineStage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepOrder: { type: integer }
        name: { type: string }
        type: { type: string, enum: [review, approve, backup, execute, verify, manual, notify] }
        config:
          type: string
          description: |
            按类型解释的 JSON:review `{"failOn":"error|warn|none"}`、
            backup/verify `{"sql":"…"}`、verify 另可 `{"expect":"empty|nonempty"}`、
            manual `{"note":"…"}`。
        onFailure: { type: string, enum: [abort, continue], description: 执行阶段强制 abort }
    PipelineDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        tierCode: { type: string, description: 空 = 适用全部分层;填值则只对该分层可选 }
        enabled: { type: boolean }
        isDefault: { type: boolean, description: 全局唯一;设置新的会清掉旧的 }
        stages: { type: array, items: { $ref: '#/components/schemas/PipelineStage' } }

    ReleaseStage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        stepOrder: { type: integer }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, running, waiting, success, failed, skipped] }
        log: { type: string, description: '列表接口里为空,详情接口才带。执行阶段的日志含逐条语句的执行摘要;返回结果集的语句(如自查 SELECT)会附对齐文本表预览(上限 20 行、单元格 60 字符,省略必有说明),口令等敏感值出口统一打码' }
        findings: { type: string, description: 审查阶段的 ReviewResult(JSON 字符串) }
        approvalId: { type: integer, format: int64 }
        approvalNo: { type: string }
        confirmedBy: { type: string, description: 'execute 执行闸的放行人;空 = 尚未确认(阶段到达即停 waiting)。可点:创建者本人或审批角色' }
        rows: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    ReleaseView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        relNo: { type: string, example: REL-42 }
        title: { type: string }
        pipelineId: { type: integer, format: int64 }
        pipelineName: { type: string, description: 快照,模板改名不影响历史 }
        connectionId: { type: integer, format: int64 }
        instance: { type: string }
        database: { type: string }
        env: { type: string, description: 快照:在哪个环境跑的 }
        tierCode: { type: string, description: 快照:按哪个分层判的 }
        engine: { type: string }
        projectId: { type: integer, format: int64, description: '归属项目 —— 取**目标库**的归属;0 = 未归属' }
        projectName: { type: string, description: 提交时快照 —— 库以后改挂别的项目,历史单据不改账 }
        changeType: { type: string, enum: [dml, ddl, ''], description: '变更类型:dml=数据订正,ddl=结构变更;历史单为空。提交时校验:声明与内容不符、或两类语句同单,均拒收' }
        sql: { type: string, description: 口令已打码;列表接口里截断 }
        reason: { type: string }
        creator: { type: string }
        source: { type: string, enum: [console, api] }
        clientName: { type: string, description: source=api 时的外部系统名 }
        externalRef: { type: string, description: 外部系统自己的单号 }
        status: { type: string, enum: [pending, running, waiting, success, failed, aborted] }
        risk: { type: string, enum: [high, mid, low] }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        stages: { type: array, items: { $ref: '#/components/schemas/ReleaseStage' } }
    ReleaseReq:
      type: object
      required: [connectionId]
      properties:
        title: { type: string }
        pipelineId: { type: integer, format: int64, description: 0 = 用目标分层的默认流程 }
        connectionId: { type: integer, format: int64 }
        database: { type: string }
        sql: { type: string }
        changeType: { type: string, enum: [dml, ddl], description: '空 = 按语句推断。分类口径:SELECT 计入 DML,GRANT/REVOKE 计入 DDL,事务/会话控制(BEGIN/COMMIT/SET/USE)中性不参与判定' }
        scriptUploadId: { type: integer, format: int64, description: 与 sql 二选一;按摘要校验后执行 }
        reason: { type: string }
        mfaCode: { type: string }

    CompileReq:
      type: object
      required: [type, name]
      properties:
        scope: { type: string, description: 'owner / schema;留空用连接账号的当前 schema' }
        type: { type: string, enum: [package, procedure, function, trigger, type, view, materialized view] }
        name: { type: string, description: 对象名;必须是合法 Oracle 标识符(拼入语句,不可绑定) }
        database: { type: string }
    RecompileReq:
      type: object
      properties:
        scope: { type: string, description: 'owner / schema;留空用连接账号的当前 schema' }
        database: { type: string }
        names:
          type: array
          items: { type: string }
          description: 留空 = 该 schema 下全部无效对象;非空 = 只编这几个(界面勾选)
    CompileResp:
      type: object
      properties:
        ok: { type: boolean, description: 所有编译单元 VALID 且无诊断才为 true }
        report:
          type: object
          properties:
            object: { type: string }
            kind: { type: string }
            ms: { type: integer }
            targets:
              type: array
              description: 每个编译单元编译后的状态(包有 PACKAGE 与 PACKAGE BODY 两个)
              items:
                type: object
                properties:
                  type: { type: string, example: PACKAGE BODY }
                  status: { type: string, enum: [VALID, INVALID] }
            errors:
              type: array
              description: all_errors 的内容 —— 行、列与编译器原文
              items:
                type: object
                properties:
                  type: { type: string }
                  line: { type: integer }
                  position: { type: integer }
                  text: { type: string, example: 'PLS-00103: 出现符号 ";"' }
            warnings:
              type: array
              description: 单条 ALTER 的驱动报错(如只有规格没有包体时的 COMPILE BODY)
              items: { type: string }
    DatabaseProjectReq:
      type: object
      required: [database]
      properties:
        database: { type: string, description: 库名,取对象树给出的那个名字 }
        projectId: { type: integer, format: int64, description: 0 = 取消归属(合法取值,不是"没填") }
    SensitiveColumnReq:
      type: object
      required: [columnName]
      properties:
        tableName: { type: string, example: t_user, description: "留空或 '*' = 所有表(口令、密钥这类字段在哪张表上都不该被看到)" }
        columnName: { type: string, example: id_card }
        maskStyle: { type: string, enum: [partial, full, hash], default: partial, description: 'partial 留头留尾;full 整体抹掉;hash 同值同码(能核对是不是同一个,看不出是谁)' }
        enabled: { type: boolean }
        note: { type: string, description: 为什么它是敏感的,给后来人看 }
    SensitiveColumnView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tableName: { type: string }
        columnName: { type: string }
        maskStyle: { type: string, enum: [partial, full, hash] }
        enabled: { type: boolean }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    ProjectReq:
      type: object
      required: [name]
      properties:
        name: { type: string, example: 订单业务线, description: 名称即身份,唯一 }
        owner: { type: string, nullable: true, description: '负责人 / 团队;编辑时缺席=不变' }
        description: { type: string, nullable: true, description: 编辑时缺席=不变 }
    ProjectView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        owner: { type: string }
        description: { type: string }
        databases: { type: integer, description: 名下的数据库数;>0 时不可删除 }
        releases: { type: integer, description: 名下的升级单数(含库已改挂他处的历史单据) }
        createdAt: { type: string, format: date-time }
    ServiceAccountReq:
      type: object
      required: [name, roleIds]
      properties:
        name: { type: string, example: 升级单平台 }
        roleIds: { type: array, items: { type: integer, format: int64 }, description: 多角色取并集,决定它的发布能到哪些分层 }
        tags: { type: array, items: { type: string }, description: 标签范围;空 = 按角色派生范围 }
        dept: { type: string, description: 列表展示用,默认「服务账号」 }
    ServiceAccountView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, example: svc-upgrade-portal-1a2b3c4d@service.vela, description: 自动生成的唯一标识,不是邮箱 }
        status: { type: string }
        dept: { type: string }
        roles: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        clients: { type: integer, description: 已绑定的 API 凭据数 }

    APIClient:
      type: object
      description: 开放接口凭据。响应里**没有**密钥 —— 库里只存 bcrypt 哈希。
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        key: { type: string, example: ak_e1026cc86fe60da7 }
        userId: { type: integer, format: int64 }
        userName: { type: string, description: 绑定的服务账号;能力矩阵与审计归属都按它算 }
        allowIps: { type: string, description: 逗号分隔 IP/CIDR;空 = 不限来源 }
        scopes: { type: string, example: 'release:create,release:read,review:check' }
        pipelineId: { type: integer, format: int64, description: 该凭据建单固定走的发布流程;0 = 未绑定,走目标分层默认流程 }
        enabled: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    APIClientReq:
      type: object
      description: |
        创建时 name/userId 必填。**更新是局部语义**:只有请求里出现的字段会变,缺席
        字段一律保持原值 —— 启停开关只发 {enabled},不会动 IP 白名单;allowIps 传空串
        才是显式清空。
      required: [name, userId]
      properties:
        name: { type: string }
        userId: { type: integer, format: int64, description: 绑定的服务账号(见 /service-accounts);必填且不给默认值 —— 不要绑管理员或任何人类账号 }
        allowIps: { type: string, nullable: true, description: 逗号分隔 IP/CIDR;更新时缺席=不变,空串=清空(不限来源) }
        scopes: { type: array, items: { type: string, enum: ['release:create', 'release:read', 'review:check'] }, description: 更新时缺席=不变 }
        pipelineId: { type: integer, format: int64, nullable: true, description: 绑定建单走的发布流程;更新时缺席=不变,0=解绑(回分层默认)。绑定的流程须存在且启用 }
        enabled: { type: boolean, nullable: true, description: 更新时缺席=不变 }

    OpenReleaseReq:
      type: object
      description: |
        外部系统提交的升级单。实例用**名字**寻址(`instance`)或 connectionId。
        **发布流程不可指定**:由网关侧配置 —— 管理员在凭据上绑定一条流水线,或回落
        到目标分层的默认流程;请求里出现 pipeline/pipelineId 会被整单拒绝(拒绝而非
        忽略:静默忽略会让调用方以为自己指定成功了)。正文三选一:`sql`、`script`
        (或 `scriptBase64`)、multipart 的 `file` 字段。
      properties:
        title: { type: string }
        externalRef:
          type: string
          description: |
            调用方自己的单号,**幂等键**。同一凭据 + 同一 externalRef 重试会返回第一次
            创建的那张单,不会重复下发变更(数据库唯一索引兜底,并发重试也安全)。
        instance: { type: string, example: order-cluster }
        connectionId: { type: integer, format: int64 }
        database: { type: string }
        pipeline: { type: string, deprecated: true, description: '**不可再指定**:发布流程由网关侧配置(凭据绑定 > 分层默认),请求携带此字段会被整单拒绝' }
        pipelineId: { type: integer, format: int64, deprecated: true, description: 同 pipeline —— 携带即拒 }
        changeType: { type: string, enum: [dml, ddl], description: '建议总是显式声明;空 = 按语句推断。声明与内容不符、或 DML/DDL 同单,提交即拒(错误点名第几条/什么动词)' }
        sql: { type: string }
        script: { type: string, description: 脚本全文;落盘并记摘要,执行阶段重读校验 }
        scriptBase64: { type: string, description: 脚本的 base64,避免 JSON 转义出错 }
        filename: { type: string, default: upgrade.sql }
        reason: { type: string }
        mfaCode: { type: string, description: 目标分层要求二次验证且服务账号已绑 TOTP 时才需要 }
    OpenStage:
      type: object
      properties:
        order: { type: integer }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [pending, running, waiting, success, failed, skipped] }
        log: { type: string, description: 只有状态查询接口返回 }
        approvalNo: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    OpenReleaseResp:
      type: object
      description: 对外的稳定契约,刻意不等于内部的 ReleaseView。
      properties:
        relNo: { type: string, example: REL-42 }
        title: { type: string }
        status: { type: string, enum: [pending, running, waiting, success, failed, aborted] }
        changeType: { type: string, enum: [dml, ddl], description: 声明的或推断出的变更类型 }
        risk: { type: string }
        instance: { type: string }
        database: { type: string }
        env: { type: string }
        pipeline: { type: string }
        externalRef: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        stages: { type: array, items: { $ref: '#/components/schemas/OpenStage' } }

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/R' }

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- 健康检查
  /healthz:
    servers:
      - url: /
        description: 不在 /api/v1 前缀下
    get:
      tags: [auth]
      summary: 健康检查(无需鉴权)
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /docs:
    servers:
      - url: /
        description: 不在 /api/v1 前缀下
    get:
      tags: [auth]
      summary: 本文件的可读版(浏览器直接打开)
      description: |
        由网关自己渲染 —— 服务端读同一份 `docs/openapi.yaml`,不加载任何外部资源,
        断网环境照常可用。原始 YAML 在 `/openapi.yaml`。
      security: []
      responses: { '200': { description: text/html } }

  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      summary: 登录(受 IP 白名单与登录频控约束)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginReq' } } }
      responses:
        '200':
          description: OK / 40100 凭据错误 / 42800 需 MFA 验证码 / 42900 过于频繁
          content: { application/json: { schema: { $ref: '#/components/schemas/R' } } }
  /auth/logout:
    post:
      tags: [auth]
      summary: 退出登录(作废当前会话代次)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户 + 菜单 + 能力矩阵
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/MeResp' } } }
  /auth/mfa/setup:
    post:
      tags: [auth]
      summary: 生成 TOTP 密钥与二维码 URI(尚未启用)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /auth/mfa/enable:
    post:
      tags: [auth]
      summary: 用一次验证码确认并启用 TOTP
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /auth/mfa/disable:
    post:
      tags: [auth]
      summary: 解绑 TOTP(需当前验证码)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /gateway/stats:
    get:
      tags: [auth]
      summary: 网关实测延迟与拦截计数(不挂菜单)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /approval-chain:
    get:
      tags: [approvals]
      summary: 默认审批链(终端与风险检查器展示用)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notifications:
    get:
      tags: [auth]
      summary: 站内通知收件箱
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 30 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notifications/read:
    post:
      tags: [auth]
      summary: 标记通知已读(ids 为空表示全部)
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- terminal
  /risk/check:
    post:
      tags: [terminal]
      summary: '[terminal] 三层预检,不执行'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RiskCheckReq' } } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RiskCheckResp' } } }
  /terminal/exec:
    post:
      tags: [terminal]
      summary: '[terminal] 执行命令(WS 不可用时的 REST 回退)'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ExecReq' } } }
      responses:
        '200':
          description: OK / 42200 已转审批(返回 approvalNo)/ 42800 需二次验证 / 40300 拒绝
          content: { application/json: { schema: { $ref: '#/components/schemas/ExecResp' } } }
  /terminal/exec-async:
    post:
      tags: [terminal]
      summary: '[terminal] 后台执行长耗时 SQL,返回任务号后轮询'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /terminal/ws:
    get:
      tags: [terminal]
      summary: 终端流式执行(WebSocket,token 走 Sec-WebSocket-Protocol)
      security: []
      responses: { '101': { description: Switching Protocols } }
  /terminal/transcript-export:
    post:
      tags: [terminal]
      summary: '[terminal] 记录一次会话日志导出(只报描述,不回传日志正文)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /async-jobs:
    get:
      tags: [terminal]
      summary: '[terminal] 我的后台任务(监管角色可见全部)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /async-jobs/{id}:
    get:
      tags: [terminal]
      summary: '[terminal] 后台任务详情 + 流式日志'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- scripts
  /scripts/config:
    get:
      tags: [scripts]
      summary: '[terminal] 脚本保存路径是否已配置'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /scripts/scan:
    post:
      tags: [scripts]
      summary: '[terminal] 逐语句扫描脚本并判级'
      responses: { '200': { description: OK。无扫描基准分层时报错而不是"全部通过" } }
  /scripts/execute:
    post:
      tags: [scripts]
      summary: '[terminal] 执行脚本;检出高危则整脚本转审批'
      responses: { '200': { description: 'OK / 42200 / 42800' } }
  /scripts/uploads:
    get:
      tags: [scripts]
      summary: '[terminal] 我上传的脚本(只看自己的)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /scripts/upload:
    post:
      tags: [scripts]
      summary: '[terminal] 上传脚本(multipart 的 file,或 JSON 的 content+filename)'
      responses: { '200': { description: 'OK / 42600 保存路径未配置' } }
  /scripts/uploads/{id}/download:
    get:
      tags: [scripts]
      summary: '[terminal] 下载自己的脚本文件'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 文件流 } }
  /scripts/uploads/{id}/content:
    get:
      tags: [scripts]
      summary: '[terminal] 读取脚本正文(在线查看)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /scripts/uploads/{id}:
    delete:
      tags: [scripts]
      summary: '[terminal] 删除自己的脚本'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- snippets
  /snippets:
    get:
      tags: [snippets]
      summary: '[terminal] 我的快捷脚本'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [snippets]
      summary: '[terminal] 新建快捷脚本'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /snippets/limits:
    get:
      tags: [snippets]
      summary: '[terminal] 长度与数量上限(前后端同源,避免写完才被拒)'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /snippets/{id}:
    put:
      tags: [snippets]
      summary: '[terminal] 修改快捷脚本(占用已被绑定的槽位会释放原脚本)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [snippets]
      summary: '[terminal] 删除快捷脚本'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- export
  /export/config:
    get:
      tags: [export]
      summary: '[terminal] 导出保存路径是否已配置、归档保留几天'
      description: 'data.enabled/savePath 说明导出是否可用;data.retentionDays 是归档在服务器上的保留天数(0 = 永久保留),前端据此提示用户文件何时被清理。'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /export:
    post:
      tags: [export]
      summary: '[terminal] 提交导出任务(仅限单条只读查询)'
      description: |
        导出**默认脱敏**:命中敏感字段规则的列在服务端打码后才写进归档
        (ADR 0009 —— 一份带原值的 CSV 落到磁盘、发进聊天工具,比在终端上看一眼跑得远得多)。

        `includeSensitive: true` 要的是原值。它不会让这次导出立刻跑:任务停在
        `awaiting`、生成一张高危审批单,批准之后才由 worker 后台执行。
        那张单**不能**用 `/approvals/{id}/execute` 手动执行 —— 它授权的是"让导出任务去跑",
        而它的 command 是一句描述而不是可执行的语句。

        放行原值的那一刻 worker 还会再核一次审批状态:这道复核是重复的,故意的 ——
        这类旁路最常见的失效方式是后来有人加了新路径、忘了先检查。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, sql]
              properties:
                connectionId: { type: integer }
                sql: { type: string, description: 单条只读查询 }
                name: { type: string }
                database: { type: string }
                includeSensitive:
                  type: boolean
                  default: false
                  description: 要敏感字段的原值。为 true 时任务停在 awaiting 等审批,不直接执行。
      responses: { '200': { description: 'OK(includeSensitive 时任务为 awaiting)/ 42601 保存路径未配置 / 40001 非只读语句' } }
  /export/jobs:
    get:
      tags: [export]
      summary: '[terminal] 我的导出任务'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /export/download:
    get:
      tags: [export]
      summary: '[terminal] 下载导出分卷'
      parameters: [{ name: file, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: 文件流 } }

  # ---------------------------------------------------------------- 敏感字段
  /sensitive-columns:
    get:
      tags: [connections]
      summary: '[terminal] 敏感字段列表'
      description: |
        按 表名 + 字段 定义。命中的列在**结果离开网关之前**就被打码,回传的数据本身
        已经是脱敏后的 —— 前端不做、也不该做任何脱敏工作:让浏览器负责打码等于把
        明文发过去再请它别显示,抓个包就绕过了,而且它已经躺在浏览器缓存和沿途代理
        的日志里。

        读开放给能进终端的人:被脱敏的列在结果里是一串星号,"为什么这列看不到"必须
        有个自己查得到的答案。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SensitiveColumnView' }
    post:
      tags: [connections]
      summary: '[terminal · admin] 新增敏感字段'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveColumnReq' }
      responses: { '200': { description: 'OK / 40001 字段名为空、脱敏方式非法或该 表.字段 已存在' } }
  /sensitive-columns/{id}:
    put:
      tags: [connections]
      summary: '[terminal · admin] 编辑敏感字段(含启用/停用)'
      description: 停用会让该字段**从此明文回传**,所以它和删除一样写入审计。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveColumnReq' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [connections]
      summary: '[terminal · admin] 删除敏感字段 —— 该字段将不再脱敏'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- connections
  /projects:
    get:
      tags: [connections]
      summary: '[*] 项目列表(含名下数据库数与升级单数)'
      description: |
        归属的单位是**数据库**,不是数据源:一个实例底下的几个库分属不同团队是常态,
        把归属挂在实例上,等于逼着人按项目去拆实例。

        项目是**组织维度,不是安全边界**:它回答"这个库、这张单归谁跟进",判定层
        (能力矩阵 / 标签范围 / 高危字典)一概不看它。谁能访问哪些库,仍然只由
        Connection.tags 与角色决定。读开放给所有已登录用户 —— 归属信息本身不敏感。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectView' }
    post:
      tags: [connections]
      summary: '[project · admin] 新建项目'
      description: 名称即身份(唯一)。
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectReq' }
      responses: { '200': { description: 'OK / 40001 名称为空或重名' } }
  /projects/{id}:
    patch:
      tags: [connections]
      summary: '[project · admin] 编辑项目(局部更新:缺席字段保持原值)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectReq' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [connections]
      summary: '[project · admin] 删除项目(名下还有数据库时拒绝)'
      description: |
        名下仍有数据库时**拒绝删除**并说明还剩几个 —— 悄悄把库变成"未归属",会让
        跟进视图静静地说谎。历史升级单不阻止删除:它们带的是项目名的快照,项目没了
        也读得出当初挂在哪。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'OK / 40001 名下还有数据库' } }
  /connections:
    get:
      tags: [connections]
      summary: 实例列表(按调用者的标签范围过滤)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [connections]
      summary: '[db · admin] 新建实例'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}:
    put:
      tags: [connections]
      summary: '[db · admin] 编辑实例(留空口令表示保持不变)'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [connections]
      summary: '[db · admin] 局部修改:status / tags / policy'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/database-project:
    put:
      tags: [connections]
      summary: '[db · admin] 把实例下的一个库归到项目(projectId 0 = 取消归属)'
      description: |
        归属的单位是**数据库**,不是实例 —— 一个实例底下的几个库分属不同团队是常态。

        库名按**发现到的名字**存(系统里没有库的注册表,对象树是实时 introspect 的),
        与升级单记录目标库用的是同一个字符串。库名不校验是否真实存在:对象树可能
        正好连不上,而记账不该取决于连通性;指向不存在的库的归属是惰性的 —— 没有
        任何地方会列出它。项目则必须存在,否则库会显示"已归属"而无人认领。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseProjectReq' }
      responses: { '200': { description: 'OK / 40001 项目不存在或未指定数据库' } }
  /connections/{id}/test:
    post:
      tags: [connections]
      summary: '[db · admin] 测试连通性'
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/schema:
    get:
      tags: [connections]
      summary: '[terminal] 库表树(每个库带回它的归属项目)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: database, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/objects:
    get:
      tags: [connections]
      summary: '[terminal] 视图 / 函数 / 存储过程 / 触发器等对象'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: database, in: query, schema: { type: string }, description: PostgreSQL 系必传,目录按库隔离 }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/objects/compile:
    post:
      tags: [connections]
      summary: '[terminal] 重新编译 Oracle 存储程序(包 / 过程 / 函数 / 触发器 / 类型)'
      description: |
        Oracle 专有:包在依赖对象改动后会变成 INVALID,这里让 DBA 立刻重编并当场看到错误,
        而不是等下一次业务调用才暴露。**编译是一次 DDL**,因此与终端走同一套闸门(菜单权限
        → 能力矩阵 ddl 维度 → 高危字典 + 严格模式),逐条记审计;命中需审批的实例会被拒绝并
        指向发布单,而不是降级执行。

        成功与否**不以驱动是否报错为准** —— `ALTER … COMPILE` 即使编译失败也返回成功,只是
        把对象留成 INVALID。响应里的 ok 由回读 all_objects.status 与 all_errors 决定:所有
        单元 VALID 且无诊断才算通过。包会编译规格与包体两个单元(只编规格会让包体失效)。

        对象名与 schema 是拼进 SQL 文本的(Oracle 不能把标识符做成绑定变量),因此二者都必须
        是合法 Oracle 标识符,否则整个请求被拒。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileReq' }
      responses:
        '200':
          description: 'OK(ok=false 表示编译未通过,errors 里是 all_errors 的行列与文本)/ 40300 无权 / 40001 引擎非 Oracle、标识符非法、类型不可编译、实例未配置真实凭据'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileResp' }
  /connections/{id}/objects/invalid:
    get:
      tags: [connections]
      summary: '[terminal] Oracle 无效对象清单(status = INVALID)'
      description: |
        一次表结构变更能让几十个包/视图/触发器一起变成 INVALID。Oracle 会在下次调用时**隐式**
        重编译,所以它们看起来还能用 —— 直到某个业务请求第一次踩上去。这个接口把它们摊开。

        只读:走访问控制,不走 DDL 闸。一个包的 PACKAGE 与 PACKAGE BODY 在数据字典里是两行,
        这里合成一条(它们由同一次 ALTER 一起编),units 里说明具体哪几个单元失效了。
        同义词、Java 类等 `ALTER … COMPILE` 修不了的类型不会出现在清单里。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: scope, in: query, schema: { type: string }, description: 'owner / schema;留空用连接账号的当前 schema' }
        - { name: database, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/objects/recompile:
    post:
      tags: [connections]
      summary: '[terminal] 批量重编译 Oracle 无效对象'
      description: |
        utlrp 做的事,但用业务账号做(UTL_RECOMP 要 SYSDBA)。

        **整批一起判定**:把这一批要执行的 ALTER 全部交给同一次判定,只要其中任何一条在这台
        实例上是 deny 或需审批,整批都不执行 —— 逐个判、能编的先编,会在需要审批的库上留下
        "编了一半"。执行仍然复用单个编译那条路,因此同样回读 all_objects.status 与 all_errors。

        **多轮**:编译顺序影响结果(先编依赖别人的那个,它照样失败),所以"上一轮修好了至少
        一个就再来一轮",最多三轮。**逐个记审计**,记的是每个对象这次的最终状态。

        一次最多处理 200 个对象,超出的部分在 report.skipped 里明确报告,不会悄悄只做一半。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecompileReq' }
      responses:
        '200':
          description: 'OK(ok=false 表示仍有对象编不过,items 里逐个说明)/ 40300 无权或整批判定被拒 / 40001 引擎非 Oracle、实例未配置真实凭据、命中需审批'
          content: { application/json: { schema: { $ref: '#/components/responses/Ok' } } }
  /metadata/search:
    get:
      tags: [connections]
      summary: '[terminal] 在元数据缓存里按表名 / 列名检索'
      description: |
        远端库的表清单与表结构在本地留了一份(见 `POST /connections/{id}/metadata/sync`),
        这个接口在那份副本里检索。**按列名找**是它换来的能力 —— 实时探查做不到:那意味着
        把每台实例的每张表都问一遍列,是一轮对生产的全量扫描。

        范围收在 SQL 里,只查调用者按标签授权够得到的实例:表名和列名本身就是信息。

        结果**可能过期**。判定、执行、导出一律仍然走实时的目标库 —— 一份过期的结构如果被
        拿去做判断,它就从"快"变成了"错"。每行都带 syncedAt。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 500 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/metadata:
    get:
      tags: [connections]
      summary: '[terminal] 一台实例缓存下来的表清单与最近一次同步的结果'
      description: |
        `sync` 为 null 表示这台实例**还没同步过** —— 与"同步过但一张表都没有"不是一回事,
        而这两者在界面上长得一模一样。`sync.err` 非空说明最近一次失败了,原因在里面。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: database, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/metadata/sync:
    post:
      tags: [connections]
      summary: '[db · admin] 立刻同步一台实例的元数据'
      description: |
        主动去连目标库把表与列读回来,**整台实例先删后插**(一次事务:中途失败时缓存要么
        是旧的那份、要么是新的那份,不会是"删了一半")。

        要 admin:定时同步默认关着,而手动这一下同样是让网关去登录一台生产实例。

        PostgreSQL 家族只同步**连接上配置的那个库** —— 它的目录按库隔离,读别的库要重新
        建连接,而连接凭据未必在每个库上都成立。要覆盖更多库就为它们各配一条连接。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /connections/{id}/object-source:
    get:
      tags: [connections]
      summary: '[terminal] 单个对象的源码 / 建表 DDL'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: database, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tags:
    get:
      tags: [connections]
      summary: 全部实例标签(选择器用)
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------------------------------------------------------------- tiers
  /env-tiers:
    get:
      tags: [tiers]
      summary: 控制分层列表(任何登录用户可读:树、标签、表单都要用)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [tiers]
      summary: '[envtier · admin] 新建分层 —— 必须从模板克隆规则'
      description: 没有规则行的分层不是标签,是**不受管控的环境**(查无规则行=放行),所以克隆在同一事务里完成。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /env-tiers/{code}:
    put:
      tags: [tiers]
      summary: '[envtier · admin] 修改分层(名称、MFA、危险横幅、扫描基准等)'
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [tiers]
      summary: '[envtier · admin] 删除分层(仍有环境挂靠时拒绝)'
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /exec-windows:
    get:
      tags: [tiers]
      summary: 执行窗口(「班车」)列表 —— 含"此刻是否开着"
      description: >
        窗口在指定时间、对指定的库,把本来需要审批的中/高风险语句直接放行。它改的是
        "要不要人来批",不是"有没有权限":能力矩阵禁止的仍然禁止,风险等级也不降。
        响应里的 active 由服务端用与判定完全相同的逻辑算出,前端不重算。
        读对能进该菜单的人开放 —— 一扇免审批的门开在哪、什么时候开,不该只有管理员知道。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [tiers]
      summary: '[execwindow] 申请执行窗口(提交审批,通过后才生效)'
      description: >
        提交一次**申请**,不是保存一个立即生效的配置。窗口落成 pending 并按默认审批链
        建单;判定层只认 approved,等待期间它一行都不放行。
        不再要求管理员:这个功能的意义就在于开门的人和签字的人不是同一个。

        两种时间模型:once(绝对起止时刻,与时区无关)与 recurring(带 IANA 时区的固定
        时段,结束早于开始表示跨午夜)。库名必填 —— 空库名会让窗口悄悄覆盖整台实例。
        说不清的定义当场拒绝:写坏的窗口要么白配,要么开在没预料的时间,后者是安全问题。
        每次变动写入审计链。
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /exec-windows/{id}:
    put:
      tags: [tiers]
      summary: '[execwindow] 修改执行窗口 —— 改完重新走审批'
      description: >
        改动会把窗口打回 pending 并重新建单。因为"把 02:00-04:00 改成 02:00-06:00"和
        "新开一扇 04:00-06:00 的门"是同一件事;不重审的话,审批只拦得住第一版。
        只有申请人本人或平台管理员可以改(在 service 层判,路由只认得菜单)。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [tiers]
      summary: '[execwindow] 撤销执行窗口(立刻恢复审批)'
      description: >
        撤销不走审批:关一扇门永远不需要第二个人同意。同样限申请人本人或平台管理员。
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /environments:
    get:
      tags: [tiers]
      summary: 环境列表
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [tiers]
      summary: '[envtier · admin] 新建环境并绑定到一个分层'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /environments/usage:
