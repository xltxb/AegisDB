# AegisDB — LOCAL DEVELOPMENT infrastructure (PostgreSQL 16 + Redis 7 + a MySQL 8 target).
# Start with:  docker compose up -d
# The backend reads connection info from backend/configs/config.yaml
#
# You do NOT need this file if PostgreSQL is already installed on the machine
# (e.g. `brew install postgresql@16`): `createdb vela_gateway` and the default
# DSN in config.yaml already point at 127.0.0.1:5432. This compose file is for
# hosts without a local PostgreSQL — note that its user/password differ from the
# libpq OS-user fallback the default DSN relies on, so set the DSN explicitly:
#   VELA_PG_DSN="host=127.0.0.1 port=5432 user=vela password=velapass dbname=vela_gateway sslmode=disable"
#
# WARNING: the credentials below are weak defaults for local dev only. Ports are
# bound to 127.0.0.1 so the datastores are NOT exposed on the host's network.
# Do NOT use this file in production — run PostgreSQL/Redis managed or hardened,
# with secrets from the environment (C8).
services:
  postgres:
    image: postgres:16
    container_name: vela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vela_gateway
      POSTGRES_USER: vela
      POSTGRES_PASSWORD: velapass
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432" # bind to loopback only — not the host's public interfaces
    volumes:
      - vela_pg:/var/lib/postgresql/data
      # Schema is applied by the app, not initdb.d, so it is tracked in
      # schema_migrations and there is a single migration source of truth:
      #   VELA_PG_DSN=... ./vela-gateway migrate   (then `init` for seed+admin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vela -d vela_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vela-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # loopback only
    volumes:
      - vela_redis:/data

  # A MySQL 8 to point the gateway AT — a managed target, not the gateway's own
  # store. That distinction matters: ADR 0018 settled the gateway's storage on
  # PostgreSQL and is not in question here. What needs a real MySQL is
  # internal/osc, the gh-ost-style online schema change: shadow tables, chunked
  # copy interleaved with binlog replay, and a cut-over that races for a lock.
  # ADR 0011 is explicit that green from sqlite or a mock is fake green there,
  # because none of those failure modes exist without a real server.
  #
  # The settings below are what that work needs, not MySQL defaults:
  #   log-bin        the replay stream is read from it
  #   binlog-format  ROW — STATEMENT cannot be replayed row by row
  #   row-image      FULL — under MINIMAL an UPDATE carries only the changed
  #                  columns, and the REPLACE INTO used for replay would write
  #                  the rest as defaults, silently destroying data
  mysql-target:
    image: mysql:8.0
    container_name: vela-mysql-target
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: velaroot
      MYSQL_DATABASE: osc_test
      MYSQL_USER: vela
      MYSQL_PASSWORD: velapass
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      # GTID so the replica below can use SOURCE_AUTO_POSITION=1 — without it,
      # wiring replication means pinning an exact file/offset by hand.
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      # 3307, because a locally installed MySQL already holds 3306 — and a local
      # one is all the OSC tests need, so this container is the fallback for
      # hosts without one. Point the tests at it with:
      #   VELA_OSC_MYSQL_DSN="vela:velapass@tcp(127.0.0.1:3307)/osc_test"
      - "127.0.0.1:3307:3306"
    volumes:
      - vela_mysql_target:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvelaroot"]
      interval: 3s
      timeout: 3s
      retries: 30

  # A replica OF mysql-target, so the throttling half of internal/osc can be
  # exercised for real: the copy is throttled by how far a replica has fallen
  # behind, and "a replica that is behind" does not exist on a standalone
  # instance. ADR 0011 asks for one run against an instance that HAS a replica
  # before the feature's switch is turned on; this pair is that run, automated
  # in internal/osc/replica_replication_test.go.
  #
  # NOTE: report-host is 127.0.0.1:3308, not the container name. The address the
  # master reports is the one the GATEWAY dials to read the heartbeat, not one
  # the master dials itself — and the gateway (or `go test`) runs on the host,
  # where the replica is 127.0.0.1:3308. Using `mysql-replica` here resolves
  # inside the compose network only, and throttling would silently degrade to
  # "off" for anything running on the host.
  #
  # Both ends need GTID for SOURCE_AUTO_POSITION=1 (mysql-target enables it too).
  mysql-replica:
    image: mysql:8.0
    container_name: vela-mysql-replica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: velaroot
      MYSQL_DATABASE: osc_test
      MYSQL_USER: vela
      MYSQL_PASSWORD: velapass
    command:
      - --server-id=2
      - --report-host=127.0.0.1
      - --report-port=3308
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - vela_mysql_replica:/var/lib/mysql
    depends_on:
      mysql-target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvelaroot"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: create the replication account on the master and point the replica
  # at it. Runs to completion and exits — `docker compose up` shows it as exited,
  # which is expected. Re-running it is harmless (both statements are idempotent).
  mysql-replica-setup:
    image: mysql:8.0
    container_name: vela-mysql-replica-setup
    restart: "no"
    depends_on:
      mysql-target:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        set -e
        mysql -h mysql-target -uroot -pvelaroot -e "
          CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY 'replpass';
          GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';"
        mysql -h mysql-replica -uroot -pvelaroot -e "
          STOP REPLICA;
          CHANGE REPLICATION SOURCE TO SOURCE_HOST='mysql-target', SOURCE_PORT=3306,
            SOURCE_USER='repl', SOURCE_PASSWORD='replpass', SOURCE_AUTO_POSITION=1,
            GET_SOURCE_PUBLIC_KEY=1;
          START REPLICA;"
        echo "replication wired: mysql-target -> mysql-replica"

volumes:
  vela_pg:
  vela_redis:
  vela_mysql_target:
  vela_mysql_replica:
